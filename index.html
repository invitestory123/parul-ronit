    <script>
      (function() {
        function initMusic() {
          var data = window.WEDDING_DATA;
          if (!data || !data.music || !data.music.src) return;
          var audio = document.createElement('audio');
          audio.id = 'weddingBgm';
          audio.src = data.music.src;
          audio.loop = true;
          audio.preload = 'auto';
          document.body.appendChild(audio);

          var btn = document.createElement('button');
          btn.id = 'bgmToggle';
          btn.type = 'button';
          btn.className = 'bgm-floating-btn';
          btn.setAttribute('aria-label', 'Toggle background music');
          btn.setAttribute('title', data.music.title || 'Wedding Music');
          btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle><path d="M12 2a10 10 0 0 1 10 10"></path></svg>';
          document.body.appendChild(btn);

          var userManuallyPaused = false;

          function playAudio() {
            if (userManuallyPaused) return;
            var p = audio.play();
            if (p && p.then) {
              p.then(function() {
                btn.classList.add('playing');
              }).catch(function(err) {
                console.log('Audio autoplay awaiting user interaction');
              });
            }
          }

          function pauseAudio() {
            audio.pause();
            btn.classList.remove('playing');
          }

          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (audio.paused) {
              userManuallyPaused = false;
              playAudio();
            } else {
              userManuallyPaused = true;
              pauseAudio();
            }
          });

          window.__playWeddingMusic = function() {
            if (data.music && data.music.autoplay !== false) {
              userManuallyPaused = false;
              playAudio();
            }
          };

          // 1. Attempt immediate autoplay when page loads
          if (data.music && data.music.autoplay !== false) {
            playAudio();
          }

          // 2. Trigger on first user interaction anywhere on screen (satisfies strict browser autoplay gesture policy)
          var unlockEvents = ['click', 'touchstart', 'touchend', 'pointerdown', 'mousedown', 'keydown', 'scroll', 'wheel'];
          var unlockHandler = function() {
            if (!userManuallyPaused && audio.paused && data.music && data.music.autoplay !== false) {
              playAudio();
            }
            unlockEvents.forEach(function(ev) {
              window.removeEventListener(ev, unlockHandler, true);
              document.removeEventListener(ev, unlockHandler, true);
            });
          };

          unlockEvents.forEach(function(ev) {
            window.addEventListener(ev, unlockHandler, { capture: true, passive: true });
            document.addEventListener(ev, unlockHandler, { capture: true, passive: true });
          });

          // 3. Additional triggers on full window load & visibility change
          window.addEventListener('load', function() {
            if (!userManuallyPaused && audio.paused && data.music && data.music.autoplay !== false) {
              playAudio();
            }
          });

          document.addEventListener('visibilitychange', function() {
            if (!document.hidden && !userManuallyPaused && audio.paused && data.music && data.music.autoplay !== false) {
              playAudio();
            }
          });
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', initMusic);
        } else {
          initMusic();
        }
      })();
    </script>
