    <script>
      (function() {
        // Pre-declare global hook immediately so React components can call it anytime
        window.__playWeddingMusic = function() {
          if (window.__triggerWeddingMusic) {
            window.__triggerWeddingMusic();
          }
        };

        function initMusic() {
          var data = window.WEDDING_DATA;
          if (!data || !data.music || !data.music.src) return;

          var audio = document.createElement('audio');
          audio.id = 'weddingBgm';
          var resolvedSrc = data.music.src;
          try {
            resolvedSrc = new URL(data.music.src, window.location.href).href;
          } catch(e) {}
          audio.src = resolvedSrc;
          audio.loop = true;
          audio.preload = 'auto';
          audio.setAttribute('playsinline', '');
          audio.setAttribute('webkit-playsinline', '');
          audio.volume = 1.0;
          document.body.appendChild(audio);

          var btn = document.createElement('button');
          btn.id = 'bgmToggle';
          btn.type = 'button';
          btn.className = 'bgm-floating-btn';
          btn.setAttribute('aria-label', 'Toggle background music');
          btn.setAttribute('title', data.music.title || 'Wedding Music');
          btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle><path d="M12 2a10 10 0 0 1 10 10"></path></svg>';
          document.body.appendChild(btn);

          var userManuallyPaused = false;
          var hasUnlocked = false;

          function updatePlayState(isPlaying) {
            if (isPlaying) {
              btn.classList.add('playing');
            } else {
              btn.classList.remove('playing');
            }
          }

          audio.addEventListener('play', function() {
            hasUnlocked = true;
            updatePlayState(true);
            detachUnlockListeners();
          });

          audio.addEventListener('pause', function() {
            if (userManuallyPaused) {
              updatePlayState(false);
            }
          });

          audio.addEventListener('ended', function() {
            if (!userManuallyPaused) {
              audio.currentTime = 0;
              audio.play().catch(function() {});
            }
          });

          function playAudio() {
            if (userManuallyPaused) return;
            try {
              var p = audio.play();
              if (p && p.then) {
                p.then(function() {
                  hasUnlocked = true;
                  updatePlayState(true);
                  detachUnlockListeners();
                }).catch(function(err) {
                  // Keep listeners active waiting for user gesture
                });
              }
            } catch(e) {}
          }

          function pauseAudio() {
            try {
              audio.pause();
            } catch(e) {}
            updatePlayState(false);
          }

          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (audio.paused) {
              userManuallyPaused = false;
              playAudio();
            } else {
              userManuallyPaused = true;
              pauseAudio();
            }
          });

          window.__triggerWeddingMusic = function() {
            if (data.music && data.music.autoplay !== false) {
              userManuallyPaused = false;
              playAudio();
            }
          };

          // 1. Immediate play attempt when opening the link
          if (data.music && data.music.autoplay !== false) {
            playAudio();
          }

          // 2. Gesture unlock listener on all interaction events
          var unlockEvents = ['click', 'touchstart', 'touchend', 'pointerdown', 'mousedown', 'keydown'];
          function handleUserGesture(e) {
            if (hasUnlocked || userManuallyPaused) return;
            if (data.music && data.music.autoplay !== false) {
              playAudio();
            }
          }

          function detachUnlockListeners() {
            unlockEvents.forEach(function(ev) {
              window.removeEventListener(ev, handleUserGesture, true);
              document.removeEventListener(ev, handleUserGesture, true);
            });
          }

          unlockEvents.forEach(function(ev) {
            window.addEventListener(ev, handleUserGesture, { capture: true, passive: true });
            document.addEventListener(ev, handleUserGesture, { capture: true, passive: true });
          });

          // 3. Audio load & page visibility triggers
          audio.addEventListener('canplay', function() {
            if (!hasUnlocked && !userManuallyPaused && data.music && data.music.autoplay !== false) {
              playAudio();
            }
          });

          window.addEventListener('load', function() {
            if (!hasUnlocked && !userManuallyPaused && data.music && data.music.autoplay !== false) {
              playAudio();
            }
          });

          window.addEventListener('pageshow', function() {
            if (!hasUnlocked && !userManuallyPaused && data.music && data.music.autoplay !== false) {
              playAudio();
            }
          });

          document.addEventListener('visibilitychange', function() {
            if (!document.hidden && !userManuallyPaused && audio.paused && data.music && data.music.autoplay !== false) {
              playAudio();
            }
          });
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', initMusic);
        } else {
          initMusic();
        }
      })();
    </script>
